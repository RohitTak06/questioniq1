random_state: 42
tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"

portal:
  url: "https://exam-quiz-portal-lib-jklu.vercel.app"
  backend: "https://learn-backend-jklu.vercel.app"
  profile_dir: ".auth"
  min_delay_seconds: 5.0
  max_retries: 3
  retry_base_seconds: 15
  login_timeout_seconds: 600
  page_size: 20

collection:
  scope: all  # all = every eligible paper; anything else stops at min_subjects
  min_subjects: 20
  skip_exam_types: [Assignment]
  skip_title_words: [assignment, coding hour]
  exclude_from_analysis: [116]  # identical file to paper 50

courses: []  # filled from the catalogue in Phase 0b

paths:
  raw: data/raw
  catalogue: data/catalogue.csv
  manifest: data/manifest.csv
  api_log: data/api_log.jsonl
  summary: reports/collection_summary.md
  ocr: data/ocr
  ocr_gold: data/ocr_gold
  questions: data/questions.csv
  questions_clean: data/questions_clean.csv
  preprocess_summary: reports/preprocess_summary.md
  preprocess_review: reports/preprocess_review.md
  preprocess_check: data/preprocess_check.csv
  seg_summary: reports/segmentation_summary.md
  seg_review: reports/segmentation_review
  seg_check: data/seg_gold/segmentation_check.csv
  seg_check_fresh: data/seg_gold/segmentation_check_fresh.csv
  gold_selection: reports/gold_selection.md
  labels: data/labels
  models: models
  metrics: reports/metrics
  figures: reports/figures
  db: data/questioniq.db

extraction:
  min_chars_per_page: 50
  dpi: 300
  psm: 6
  lang: eng
  method: layers  # otsu, adaptive or layers; chosen by CER in scripts/ocr_eval.py
  layers_min_word_ratio: 0.5  # below this share of otsu's words, layers lost text: use otsu
  layers_check_min_words: 20
  right_zone: 0.80  # marks and CO columns start after this fraction of the page width
  table_digit_ratio: 0.35
  table_min_tokens: 30
  low_confidence: 70

gold:
  n_check_papers: 10
  n_line_papers: 10
  # Re-measure after the rule fixes on papers never looked at while fixing (the reserved set).
  fresh_check_papers: [23, 24, 31, 51, 55, 63, 92, 103, 127, 143]

preprocess:
  min_token_length: 3
  n_review: 20
  # Words common to all exam questions, removed before topic modelling. Bloom verbs
  # (define, explain, ...) are removed here only; Phase 5 reads the raw text for them.
  exam_stopwords: [explain, write, brief, briefly, mark, marks, following, question, questions,
    short, note, notes, answer, give, discuss, describe, define, state, list, find, compute,
    calculate, determine, show, draw, using, use, consider, given, suitable, example, roll, page,
    # Added after the first run: frequent words that carry no topic.
    one, two, three, four, five, six, seven, eight, nine, ten, also, would, could, may, might,
    various, different, take, assume]

topics:
  k_min: 4
  k_max: 15
  top_n: 10
  min_df: 2
  ngram_range: [1, 2]
  group_min_questions: 150

annotation:
  relabel_n: 150
  relabel_delay_hours: 48

difficulty:
  cv_folds: 5
