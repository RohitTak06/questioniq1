<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuestionIQ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dash.home') }}">QuestionIQ</a>
    <nav>
      {% set here = request.endpoint %}
      <a href="{{ url_for('dash.questions') }}" class="{{ 'on' if here == 'dash.questions' }}">Questions</a>
      <a href="{{ url_for('dash.topics') }}" class="{{ 'on' if here == 'dash.topics' }}">Topics</a>
      <a href="{{ url_for('dash.trends') }}" class="{{ 'on' if here == 'dash.trends' }}">Trends</a>
      <a href="{{ url_for('dash.report') }}" class="{{ 'on' if here == 'dash.report' }}">Model report</a>
      <a href="{{ url_for('dash.upload') }}" class="{{ 'on' if here == 'dash.upload' }}">Upload</a>
      <a href="{{ url_for('main.index') }}" class="{{ 'on' if here in ('main.index', 'main.annotate') }}">Label</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>

  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Explanation">
    <button class="drawer-close" type="button" aria-label="Close">×</button>
    <div id="drawer-body"></div>
  </aside>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
